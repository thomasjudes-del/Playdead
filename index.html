<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0b0d0f" />
<title>THE GLASSHOUSE — V2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090b;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#rotate{position:fixed;inset:0;z-index:50;background:#080a0c;color:#bdc5c2;display:none;align-items:center;justify-content:center;text-align:center;letter-spacing:.16em;font-size:12px;text-transform:uppercase;padding:24px}
#rotate .phone{width:46px;height:78px;border:2px solid #77807d;border-radius:8px;margin:0 auto 22px;animation:turn 1.8s ease-in-out infinite alternate}
@keyframes turn{from{transform:rotate(0)}to{transform:rotate(90deg)}}
#start{position:fixed;inset:0;z-index:20;background:linear-gradient(#101417,#07090b);display:flex;align-items:center;justify-content:center;color:#d6ddda;text-align:center;transition:opacity .8s}
#start .inner{opacity:.82}
#start b{font-size:13px;letter-spacing:.42em;font-weight:600}
#start span{display:block;margin-top:15px;font-size:10px;letter-spacing:.16em;opacity:.45}
#start em{display:block;margin-top:38px;font-size:10px;letter-spacing:.12em;font-style:normal;opacity:.38}
#micro{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;color:#c9d0cd;font-size:9px;letter-spacing:.14em;white-space:nowrap;text-transform:uppercase;opacity:0;transition:opacity .5s;pointer-events:none;text-shadow:0 2px 8px #000}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.18) 76%,rgba(0,0,0,.48) 100%)}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate"><div><div class="phone"></div>Rotate device<br>Landscape required</div></div>
<div id="start"><div class="inner"><b>THE GLASSHOUSE</b><span>movement study · v2</span><em>touch to enter</em></div></div>
<div id="micro"></div><div id="vignette"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const host=document.getElementById('game'), start=document.getElementById('start'), micro=document.getElementById('micro');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x151a1c);
scene.fog=new THREE.FogExp2(0x151a1c,0.018);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.8;
host.appendChild(renderer.domElement);

let aspect=innerWidth/innerHeight, frustum=10.7;
const camera=new THREE.OrthographicCamera(-frustum*aspect/2,frustum*aspect/2,frustum/2,-frustum/2,.1,100);
camera.position.set(0,3.9,13);camera.lookAt(0,2.3,0);

const hemi=new THREE.HemisphereLight(0x8fa4a3,0x080b0d,.58);scene.add(hemi);
const key=new THREE.DirectionalLight(0xc4d0ca,2.3);key.position.set(-4,8,6);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-18;key.shadow.camera.right=18;key.shadow.camera.top=12;key.shadow.camera.bottom=-4;scene.add(key);
const cold=new THREE.PointLight(0x8aa7a8,18,18,2);cold.position.set(9,6,-2);scene.add(cold);
const warm=new THREE.PointLight(0xb9a06a,0,10,2);warm.position.set(18,2.2,1.4);scene.add(warm);

const mat=(c,r=.75,m=.05)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const concrete=mat(0x303638,.95,.02), steel=mat(0x22282a,.62,.48), dark=mat(0x111619,.9,.08), glass=new THREE.MeshPhysicalMaterial({color:0x6f8684,roughness:.25,metalness:0,transmission:.15,transparent:true,opacity:.18,side:THREE.DoubleSide});
function box(x,y,z,w,h,d,material=concrete,shadow=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=shadow;scene.add(o);return o}

// Ground and layered greenhouse shell
box(12,-.55,0,52,1,9,dark);
for(let x=-12;x<38;x+=4){const post=box(x,3.5,-2.8,.13,8,.13,steel);post.rotation.z=.02*Math.sin(x);}
for(let x=-12;x<38;x+=4){const post=box(x,3.5,2.8,.13,8,.13,steel);}
for(let x=-10;x<38;x+=5){const pane=box(x,6,-1.4,4.2,.06,5.5,glass,false);pane.rotation.z=-.33;}
for(let x=-8;x<38;x+=6){const pipe=box(x,1.75,-2.25,.14,3.5,.14,steel);pipe.rotation.z=.06;}
// back industrial masses
for(const [x,w,h] of [[-9,5,4],[0,7,5.5],[11,4,6.7],[24,8,5.2],[34,5,7]]) box(x,h/2-.05,-5,w,h,2,mat(0x202629,.9,.1),false);
// translucent window slots
for(let x=-10;x<36;x+=3.4){const q=box(x,4.5,-3.88,2.2,1.5,.04,new THREE.MeshBasicMaterial({color:0x809a98,transparent:true,opacity:.055}),false);}

// Gameplay props: readable silhouettes
const crate=new THREE.Group();
const crateBody=new THREE.Mesh(new THREE.BoxGeometry(1.18,1.05,1.05),mat(0x574d3f,.92,.05));crateBody.castShadow=crateBody.receiveShadow=true;crate.add(crateBody);
for(const z of [-.53,.53]){const a=new THREE.Mesh(new THREE.BoxGeometry(1.32,.08,.08),mat(0x2b2925,.8,.15));a.position.set(0,.46,z);crate.add(a)}
crate.position.set(4.8,.53,0);scene.add(crate);
const plate=box(8.25,.025,0,1.5,.05,1.3,mat(0x3c4442,.6,.35));
const gate=box(11.7,2.1,0,.28,4.2,5.5,steel);let gateOpen=0;
const generator=new THREE.Group();
const genBody=new THREE.Mesh(new THREE.BoxGeometry(1.05,1.35,1.25),mat(0x293133,.65,.4));genBody.castShadow=true;generator.add(genBody);
const genLamp=new THREE.Mesh(new THREE.BoxGeometry(.22,.10,.05),new THREE.MeshBasicMaterial({color:0x4c554d}));genLamp.position.set(.25,.28,.64);generator.add(genLamp);
const handle=new THREE.Mesh(new THREE.BoxGeometry(.08,.7,.08),steel);handle.position.set(.46,.42,.67);handle.rotation.z=-.3;generator.add(handle);
generator.position.set(18,.7,0);scene.add(generator);let powered=false;
// raised return path
box(2.1,3.15,0,4.9,.32,3.2,concrete);box(7.1,3.15,0,3.2,.32,3.2,concrete);box(14.2,3.15,0,4.2,.32,3.2,concrete);box(20.8,3.15,0,6,.32,3.2,concrete);
const lift=box(-.15,.14,0,1.8,.28,2.5,steel);let liftTarget=.14;
const exitDoor=box(23.15,4.55,0,.18,2.45,2.55,steel);let exitOpen=0;

// sparse details
for(let i=0;i<34;i++){const s=.04+Math.random()*.11;const m=new THREE.Mesh(new THREE.SphereGeometry(s,5,4),new THREE.MeshBasicMaterial({color:0x9cb1aa,transparent:true,opacity:.08+Math.random()*.12}));m.position.set(-10+Math.random()*47,.8+Math.random()*6,-3+Math.random()*5);m.userData.base=m.position.y;m.userData.speed=.15+Math.random()*.3;scene.add(m)}
const dust=scene.children.filter(o=>o.geometry?.type==='SphereGeometry'&&o!==undefined);

// articulated character
const hero=new THREE.Group();scene.add(hero);
const skin=mat(0xa3917b,.9,0), shirt=mat(0x764739,.92,0), pants=mat(0x15191b,.92,.02);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.72,4,8),shirt);torso.position.y=1.18;torso.castShadow=true;hero.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.285,12,10),skin);head.position.y=1.93;head.castShadow=true;hero.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.292,10,8,0,Math.PI*2,0,1.9),mat(0x17191a,.95,0));hair.position.set(-.025,2.01,-.01);hero.add(hair);
function limb(rad,len,material){const g=new THREE.Group();const mesh=new THREE.Mesh(new THREE.CapsuleGeometry(rad,len,3,6),material);mesh.position.y=-len/2;mesh.castShadow=true;g.add(mesh);return g}
const armL=limb(.105,.72,skin),armR=limb(.105,.72,skin),legL=limb(.13,.86,pants),legR=limb(.13,.86,pants);
armL.position.set(-.31,1.55,0);armR.position.set(.31,1.55,0);legL.position.set(-.15,.78,0);legR.position.set(.15,.78,0);hero.add(armL,armR,legL,legR);
hero.scale.set(.95,.95,.95);hero.position.set(-7,0,0);

const state={x:-7,y:0,vx:0,vy:0,onGround:true,facing:1,speed01:0,step:0,grab:false};
const input={pointer:false,id:null,sx:0,sy:0,x:0,y:0,move:0,jump:false,hold:false,holdT:0};
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight','Space','ArrowUp'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
const cv=renderer.domElement;cv.style.touchAction='none';
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;input.pointer=true;input.id=e.pointerId;input.sx=input.x=e.clientX;input.sy=input.y=e.clientY;input.holdT=performance.now();input.hold=false;cv.setPointerCapture?.(e.pointerId);},{passive:false});
cv.addEventListener('pointermove',e=>{if(!input.pointer||e.pointerId!==input.id)return;e.preventDefault();input.x=e.clientX;input.y=e.clientY;const dx=e.clientX-input.sx,dy=e.clientY-input.sy;if(dy<-48&&Math.abs(dy)>Math.abs(dx)*.85){input.jump=true}else{const dead=12;input.move=Math.abs(dx)<dead?0:THREE.MathUtils.clamp(dx/105,-1,1)}} ,{passive:false});
function endPointer(e){if(e.pointerId!==input.id)return;input.pointer=false;input.move=0;input.hold=false;input.id=null}cv.addEventListener('pointerup',endPointer);cv.addEventListener('pointercancel',endPointer);

start.addEventListener('pointerdown',async()=>{start.style.opacity='0';setTimeout(()=>start.remove(),850);try{await document.documentElement.requestFullscreen?.();await screen.orientation?.lock?.('landscape')}catch{}},{once:true});

function groundHeightAt(x){if(x>-1.1&&x<.8&&lift.position.y>1)return lift.position.y+.14;if(x>-0.35&&x<4.55&&state.y>2.2)return 3.31;if(x>5.5&&x<8.7&&state.y>2.2)return 3.31;if(x>12.1&&x<16.3&&state.y>2.2)return 3.31;if(x>17.8&&x<23.8&&state.y>2.2)return 3.31;return 0}
function blockedAt(x){return gateOpen<3.7&&x>11.15&&x<12.05&&state.y<2.7}
function updatePlayer(dt){let dir=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);if(input.pointer)dir=input.move;
const target=dir*3.45;const accel=state.onGround?12.5:4.2;state.vx=THREE.MathUtils.damp(state.vx,target,accel,dt);if(Math.abs(dir)<.03)state.vx=THREE.MathUtils.damp(state.vx,0,15,dt);if(Math.abs(dir)>.05)state.facing=Math.sign(dir);
if(input.pointer&&performance.now()-input.holdT>120&&Math.abs(input.x-input.sx)<16&&Math.abs(input.y-input.sy)<16)input.hold=true;
if((input.jump||keys.Space||keys.ArrowUp)&&state.onGround){state.vy=6.0;state.onGround=false;input.jump=false}
state.vy-=15.5*dt;state.vy=Math.max(state.vy,-12);
let nx=state.x+state.vx*dt;if(blockedAt(nx)){nx=state.x;state.vx=0}
// crate physical push, intentionally forgiving
if(state.y<1&&Math.abs(nx-crate.position.x)<.88){let push=state.vx*dt*.88;crate.position.x=THREE.MathUtils.clamp(crate.position.x+push,3.8,10.25);nx=crate.position.x-state.facing*.88;}
state.x=nx;state.y+=state.vy*dt;const gy=groundHeightAt(state.x);if(state.y<=gy){state.y=gy;state.vy=0;state.onGround=true}else state.onGround=false;
hero.position.set(state.x,state.y,0);hero.rotation.y=state.facing<0?Math.PI:0;
const sp=Math.abs(state.vx)/3.45;state.speed01=THREE.MathUtils.damp(state.speed01,sp,8,dt);state.step+=Math.abs(state.vx)*dt*2.55;
// animation with anticipation, asymmetry and vertical response
const cycle=Math.sin(state.step),cycle2=Math.sin(state.step+Math.PI);const run=state.speed01;
const airborne=!state.onGround;const lean=THREE.MathUtils.clamp(state.vx*.055,-.18,.18)+(airborne?-.08:0);torso.rotation.z=THREE.MathUtils.damp(torso.rotation.z,-lean*state.facing,9,dt);torso.position.y=1.18-Math.abs(Math.sin(state.step*2))*.045*run+(airborne?.06:0);
head.position.y=1.93-Math.abs(Math.sin(state.step*2))*.025*run;head.rotation.z=.035*Math.sin(state.step*.5)*run;
if(airborne){legL.rotation.z=THREE.MathUtils.damp(legL.rotation.z,.62,8,dt);legR.rotation.z=THREE.MathUtils.damp(legR.rotation.z,-.45,8,dt);armL.rotation.z=THREE.MathUtils.damp(armL.rotation.z,-.35,8,dt);armR.rotation.z=THREE.MathUtils.damp(armR.rotation.z,.5,8,dt)}else{legL.rotation.z=cycle*.72*run;legR.rotation.z=cycle2*.72*run;armL.rotation.z=cycle2*.48*run;armR.rotation.z=cycle*.48*run;}
}

let hintTimer=0;
function worldLogic(dt,t){const pressed=Math.abs(crate.position.x-plate.position.x)<.72;gateOpen=THREE.MathUtils.damp(gateOpen,pressed?4.3:0,6,dt);gate.position.y=2.1+gateOpen;
const nearGen=Math.abs(state.x-generator.position.x)<1.35&&state.y<1.2;const nearLift=Math.abs(state.x-lift.position.x)<1.25;
if(input.hold&&nearGen&&!powered){powered=true;warm.intensity=13;genLamp.material.color.setHex(0xb9bf73);input.hold=false;hintTimer=2.6}
if(input.hold&&powered&&nearLift){liftTarget=liftTarget<1?3.15:.14;input.hold=false}
lift.position.y=THREE.MathUtils.damp(lift.position.y,liftTarget,2.2,dt);
if(powered){warm.intensity=11+Math.sin(t*2.4)*1.2}
if(powered&&state.x>17&&state.y<1){micro.textContent='something moved behind you';micro.style.opacity='.36'}else if(nearGen&&!powered){micro.textContent='hold';micro.style.opacity='.48'}else if(powered&&nearLift){micro.textContent='hold';micro.style.opacity='.48'}else micro.style.opacity='0';
if(state.x>22.3&&state.y>2.4)exitOpen=THREE.MathUtils.damp(exitOpen,2.7,2,dt);exitDoor.position.y=4.55+exitOpen;
for(const d of dust){d.position.y=d.userData.base+Math.sin(t*d.userData.speed+d.position.x)*.16}
}

const camPos=new THREE.Vector3();
function updateCamera(dt){const targetX=state.x+1.1*state.facing;const targetY=state.y>1.7?4.05:3.65;camera.position.x=THREE.MathUtils.damp(camera.position.x,targetX,2.7,dt);camera.position.y=THREE.MathUtils.damp(camera.position.y,targetY,2.8,dt);camera.position.z=13;camera.lookAt(camera.position.x+.15,2.35+state.y*.15,0)}

function resize(){aspect=innerWidth/innerHeight;camera.left=-frustum*aspect/2;camera.right=frustum*aspect/2;camera.top=frustum/2;camera.bottom=-frustum/2;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.033);last=now;const t=now/1000;updatePlayer(dt);worldLogic(dt,t);updateCamera(dt);renderer.render(scene,camera)}requestAnimationFrame(frame);
</script>
</body>
</html>

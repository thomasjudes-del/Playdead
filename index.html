<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#101619" />
<title>THE GLASSHOUSE — V3</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1215;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;overflow:hidden;background:#0d1215}
#game{position:absolute;inset:0;transform-origin:center center}
canvas{display:block;width:100%;height:100%;touch-action:none}
#start{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,#182126,#0c1114);display:flex;align-items:center;justify-content:center;color:#e3e9e6;text-align:center;transition:opacity .7s}
#start b{font:600 13px/1 system-ui;letter-spacing:.40em}
#start span{display:block;margin-top:14px;font:500 10px/1 system-ui;letter-spacing:.16em;opacity:.5}
#start em{display:block;margin-top:34px;font:500 10px/1 system-ui;letter-spacing:.12em;font-style:normal;opacity:.42}
#caption{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;color:#d6dfdb;font:500 9px/1 system-ui;letter-spacing:.15em;text-transform:uppercase;opacity:0;transition:opacity .35s;pointer-events:none;text-shadow:0 2px 10px #000;white-space:nowrap}
#grade{position:fixed;inset:0;pointer-events:none;z-index:9;background:radial-gradient(ellipse at 52% 42%,transparent 38%,rgba(0,0,0,.12) 72%,rgba(0,0,0,.42) 100%)}
body.virtual-landscape #game{width:100vh;height:100vw;left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%) rotate(90deg)}
body.virtual-landscape #grade{transform:rotate(90deg);width:100vh;height:100vw;left:50%;top:50%;right:auto;bottom:auto;translate:-50% -50%}
body.virtual-landscape #caption{display:none}
</style>
</head>
<body>
<div id="stage"><div id="game"></div></div>
<div id="start"><div><b>THE GLASSHOUSE</b><span>movement study · v3</span><em>touch to enter</em></div></div>
<div id="caption"></div><div id="grade"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const host=document.getElementById('game'), start=document.getElementById('start'), caption=document.getElementById('caption');
let virtualLandscape=false;
function applyOrientation(){virtualLandscape=innerHeight>innerWidth;document.body.classList.toggle('virtual-landscape',virtualLandscape);resize();}

const scene=new THREE.Scene();scene.background=new THREE.Color(0x263239);scene.fog=new THREE.Fog(0x263239,18,45);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.appendChild(renderer.domElement);
const camera=new THREE.OrthographicCamera();const frustum=9.2;

scene.add(new THREE.HemisphereLight(0xb9c9c5,0x172025,1.45));
const sun=new THREE.DirectionalLight(0xdce4da,3.2);sun.position.set(-7,10,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=14;sun.shadow.camera.bottom=-5;scene.add(sun);
const blue=new THREE.PointLight(0x9fc7cf,18,20,2);blue.position.set(5,5,-2);scene.add(blue);
const alarm=new THREE.PointLight(0xe06b4f,0,12,2);alarm.position.set(14,3,1.2);scene.add(alarm);

const M=(c,r=.8,m=.05)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const dark=M(0x182126,.92,.05),concrete=M(0x586266,.93,.02),metal=M(0x353e41,.55,.45),earth=M(0x222b28,1,0),wood=M(0x544b3e,.95,.02);
function box(x,y,z,w,h,d,mat=dark,shadow=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=shadow;scene.add(o);return o}

// Long readable exterior corridor: forest + abandoned climatic facility
box(18,-.55,0,62,1,10,earth);
for(let x=-14;x<44;x+=3.5){const trunk=box(x,3.4,-5.5,.35,7+Math.sin(x)*1.4,.35,M(0x26302c,1,0),false);trunk.rotation.z=.02*Math.sin(x*1.7)}
for(let x=-12;x<44;x+=5){const mass=box(x,6.5,-7.1,5,7,1,M(0x2c3838,1,0),false);mass.scale.y=.7+Math.random()*.8}
// facility wall in middle distance, intentionally brighter
for(const [x,w,h] of [[-7,7,4.2],[3,8,5.2],[14,6,4.6],[26,9,5.6],[38,7,4.4]]) box(x,h/2,-3.4,w,h,1.8,M(0x465256,.9,.08),false);
for(let x=-9;x<42;x+=4){box(x,3.15,-2.45,2.15,1.25,.04,new THREE.MeshBasicMaterial({color:0x9eb2ae,transparent:true,opacity:.13}),false)}
// foreground structural rhythm
for(let x=-10;x<44;x+=6){box(x,2.65,2.8,.22,5.3,.22,metal);box(x+1.5,5.15,1.8,3.4,.16,.16,metal).rotation.z=-.12}

// puddles / reflective strips
for(let x=-8;x<40;x+=7){const p=new THREE.Mesh(new THREE.PlaneGeometry(4.2,.8),new THREE.MeshBasicMaterial({color:0x738c90,transparent:true,opacity:.14}));p.rotation.x=-Math.PI/2;p.position.set(x,.01,.7);scene.add(p)}

// simple route geometry: uninterrupted first section
const gapStart=10.6,gapEnd=12.0;
box(11.3,-.95,0,1.4,.15,8,M(0x0b0f11,1,0),false);
// lever and gate only after the movement section
const leverBase=box(17.6,.55,0,.55,1.1,.8,metal);const leverArm=box(17.8,1.35,.25,.12,.9,.12,M(0x6e746b,.55,.25));leverArm.rotation.z=-.42;
const gate=box(21.1,2.1,0,.32,4.2,5.2,metal);let gateOpen=0,leverOn=false;
// ending glow
const door=box(28,1.7,0,.25,3.4,3.1,M(0x2b3436,.6,.5));const exitLight=new THREE.PointLight(0xc5d8c3,10,8,2);exitLight.position.set(29.5,2,0);scene.add(exitLight);

// rain particles
const rainGeom=new THREE.BufferGeometry(),count=650,pos=new Float32Array(count*3),speed=new Float32Array(count);
for(let i=0;i<count;i++){pos[i*3]=-14+Math.random()*60;pos[i*3+1]=Math.random()*8;pos[i*3+2]=-2+Math.random()*7;speed[i]=4+Math.random()*5}
rainGeom.setAttribute('position',new THREE.BufferAttribute(pos,3));const rainMat=new THREE.PointsMaterial({color:0xb8cecb,size:.025,transparent:true,opacity:.24});const rain=new THREE.Points(rainGeom,rainMat);scene.add(rain);

// Character: deliberately graphic silhouette, no toy skin tones
const hero=new THREE.Group();scene.add(hero);
const coat=M(0x202528,.88,.02),accent=M(0x8d4437,.86,.01),skin=M(0x8a7b68,.95,0);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.62,5,8),coat);torso.position.y=1.08;torso.castShadow=true;hero.add(torso);
const scarf=new THREE.Mesh(new THREE.BoxGeometry(.52,.18,.36),accent);scarf.position.set(0,1.42,0);hero.add(scarf);
const head=new THREE.Mesh(new THREE.SphereGeometry(.245,14,12),skin);head.position.y=1.72;head.castShadow=true;hero.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.255,12,8,0,Math.PI*2,0,1.75),M(0x141718,.98,0));hair.position.set(-.01,1.79,0);hero.add(hair);
function limb(r,len,mat){const g=new THREE.Group();const mesh=new THREE.Mesh(new THREE.CapsuleGeometry(r,len,4,7),mat);mesh.position.y=-len/2;mesh.castShadow=true;g.add(mesh);return g}
const al=limb(.085,.62,coat),ar=limb(.085,.62,coat),ll=limb(.105,.74,coat),lr=limb(.105,.74,coat);al.position.set(-.29,1.38,0);ar.position.set(.29,1.38,0);ll.position.set(-.13,.77,0);lr.position.set(.13,.77,0);hero.add(al,ar,ll,lr);hero.position.set(-8,0,0);

const state={x:-8,y:0,vx:0,vy:0,on:true,face:1,step:0,land:0};
const pointers=new Map();let movePointer=null,jumpQueued=false,holdQueued=false;
function localPointer(e){let x=e.clientX,y=e.clientY;if(!virtualLandscape)return{x,y,w:innerWidth,h:innerHeight};return{x:e.clientY,y:innerWidth-e.clientX,w:innerHeight,h:innerWidth};}
renderer.domElement.addEventListener('pointerdown',e=>{e.preventDefault();const p=localPointer(e);pointers.set(e.pointerId,{...p,sx:p.x,sy:p.y,t:performance.now()});renderer.domElement.setPointerCapture?.(e.pointerId);if(p.x<p.w*.62&&movePointer===null)movePointer=e.pointerId;else jumpQueued=true},{passive:false});
renderer.domElement.addEventListener('pointermove',e=>{const d=pointers.get(e.pointerId);if(!d)return;e.preventDefault();const p=localPointer(e);d.x=p.x;d.y=p.y;if(p.y-d.sy<-36)jumpQueued=true},{passive:false});
function pointerEnd(e){const d=pointers.get(e.pointerId);if(!d)return;if(performance.now()-d.t>180&&Math.hypot(d.x-d.sx,d.y-d.sy)<18)holdQueued=true;pointers.delete(e.pointerId);if(movePointer===e.pointerId)movePointer=null}renderer.domElement.addEventListener('pointerup',pointerEnd);renderer.domElement.addEventListener('pointercancel',pointerEnd);
const keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);

start.addEventListener('pointerdown',async()=>{start.style.opacity=0;setTimeout(()=>start.remove(),750);try{await document.documentElement.requestFullscreen?.()}catch{}},{once:true});

let eventStage=0,eventT=0;
function moveInput(){let d=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);if(movePointer!==null){const p=pointers.get(movePointer);if(p)d=THREE.MathUtils.clamp((p.x-p.sx)/86,-1,1)}return d}
function groundAt(x){if(x>gapStart&&x<gapEnd)return -3;return 0}
function updateHero(dt){const d=moveInput(),target=d*3.25;state.vx=THREE.MathUtils.damp(state.vx,target,state.on?11:4.2,dt);if(Math.abs(d)<.03)state.vx=THREE.MathUtils.damp(state.vx,0,12,dt);if(Math.abs(d)>.05)state.face=Math.sign(d);
if((jumpQueued||keys.Space||keys.ArrowUp)&&state.on){state.vy=5.55;state.on=false;jumpQueued=false}
state.vy-=14.2*dt;state.x+=state.vx*dt;state.y+=state.vy*dt;const gy=groundAt(state.x);if(state.y<=gy){if(gy<-1){state.x=8.9;state.y=0;state.vx=0;state.vy=0;state.on=true}else{if(!state.on&&state.vy<0)state.land=.12;state.y=gy;state.vy=0;state.on=true}}
if(gateOpen<3.5&&state.x>20.65&&state.x<21.5&&state.y<2.4){state.x=20.6;state.vx=0}
hero.position.set(state.x,state.y,0);hero.rotation.y=state.face<0?Math.PI:0;
const run=Math.min(1,Math.abs(state.vx)/3.25);state.step+=Math.abs(state.vx)*dt*2.55;const s=Math.sin(state.step),s2=Math.sin(state.step+Math.PI);
if(state.on){ll.rotation.z=s*.62*run;lr.rotation.z=s2*.62*run;al.rotation.z=s2*.42*run;ar.rotation.z=s*.42*run}else{ll.rotation.z=THREE.MathUtils.damp(ll.rotation.z,.5,7,dt);lr.rotation.z=THREE.MathUtils.damp(lr.rotation.z,-.35,7,dt);al.rotation.z=THREE.MathUtils.damp(al.rotation.z,-.2,7,dt);ar.rotation.z=THREE.MathUtils.damp(ar.rotation.z,.38,7,dt)}
const lean=THREE.MathUtils.clamp(state.vx*.035,-.12,.12);torso.rotation.z=THREE.MathUtils.damp(torso.rotation.z,-lean*state.face,9,dt);torso.position.y=1.08-Math.abs(Math.sin(state.step*2))*.032*run+(state.land>0?-.06:0);head.position.y=1.72-Math.abs(Math.sin(state.step*2))*.018*run;state.land=Math.max(0,state.land-dt);
}
function logic(dt,t){eventT+=dt;
// authored event: player only has to run. Lights wake up around them.
if(eventStage===0&&state.x>-2){eventStage=1;eventT=0;alarm.intensity=7}
if(eventStage===1){alarm.intensity=5+Math.sin(t*18)*3;if(eventT>1.1){eventStage=2;alarm.intensity=0;blue.intensity=26}}
if(eventStage===2&&state.x>6){eventStage=3;eventT=0;sun.intensity=1.6;scene.fog.far=34}
if(eventStage===3&&eventT>.35&&eventT<.9){camera.position.y+=.05*Math.sin(t*60)}
const nearLever=Math.abs(state.x-17.7)<1.15&&state.y<1;if(nearLever){caption.textContent='hold';caption.style.opacity=.52}else caption.style.opacity=0;
if(holdQueued&&nearLever&&!leverOn){leverOn=true;leverArm.rotation.z=.52;alarm.position.set(20.3,2.3,.9);alarm.intensity=12;holdQueued=false}
if(leverOn){gateOpen=THREE.MathUtils.damp(gateOpen,4.4,2.4,dt);gate.position.y=2.1+gateOpen;alarm.intensity=7+Math.sin(t*4)*1.5}
const a=rain.geometry.attributes.position.array;for(let i=0;i<count;i++){a[i*3+1]-=speed[i]*dt;if(a[i*3+1]<-.2)a[i*3+1]=8}rain.geometry.attributes.position.needsUpdate=true;
}
function updateCamera(dt){const lookAhead=state.face*.85+state.vx*.12;camera.position.x=THREE.MathUtils.damp(camera.position.x,state.x+lookAhead,2.8,dt);camera.position.y=THREE.MathUtils.damp(camera.position.y,3.15+Math.max(0,state.y)*.18,3,dt);camera.position.z=12.5;camera.lookAt(camera.position.x+.1,1.8+state.y*.12,0)}
function resize(){const w=virtualLandscape?innerHeight:innerWidth,h=virtualLandscape?innerWidth:innerHeight;const a=w/h;camera.left=-frustum*a/2;camera.right=frustum*a/2;camera.top=frustum/2;camera.bottom=-frustum/2;camera.near=.1;camera.far=100;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(w,h,false)}
addEventListener('resize',applyOrientation);applyOrientation();camera.position.set(-7,3.2,12.5);
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.033);last=now;const t=now/1000;updateHero(dt);logic(dt,t);updateCamera(dt);renderer.render(scene,camera)}requestAnimationFrame(frame);
</script>
</body></html>

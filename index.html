<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>THE GLASSHOUSE — playable prototype</title>
<style>
  html,body{margin:0;height:100%;background:#090d10;overflow:hidden;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#dfe8e8}
  #wrap{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#182329 0,#0a0f12 58%,#050708 100%)}
  canvas{width:100vw;height:100vh;display:block;image-rendering:auto;cursor:none}
  #hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.68;pointer-events:none;transition:opacity .6s;text-shadow:0 1px 10px #000}
  #title{position:fixed;left:34px;top:26px;pointer-events:none;opacity:.82}
  #title b{display:block;font-size:13px;letter-spacing:.34em;font-weight:650}
  #title span{display:block;margin-top:6px;font-size:10px;letter-spacing:.16em;opacity:.45}
  #veil{position:fixed;inset:0;background:#07090a;opacity:1;pointer-events:none;transition:opacity 1.5s}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="title"><b>THE GLASSHOUSE</b><span>interactive study · chapter zero</span></div>
<div id="hint">SWIPE + HOLD TO MOVE · SWIPE UP TO JUMP · HOLD NEAR OBJECTS</div>
<div id="veil"></div>
<script>
(() => {
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();audioStart()});addEventListener('keyup',e=>keys[e.code]=false);
const touch={active:false,id:null,startX:0,startY:0,lastX:0,lastY:0,moveX:0,jump:false,use:false,gestureLocked:false};
const TOUCH_DEAD=14, TOUCH_RUN=92, TOUCH_JUMP=42;
canvas.style.touchAction='none';
function resetTouch(){touch.active=false;touch.id=null;touch.moveX=0;touch.jump=false;touch.use=false;touch.gestureLocked=false}
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;audioStart();canvas.setPointerCapture?.(e.pointerId);touch.active=true;touch.id=e.pointerId;touch.startX=touch.lastX=e.clientX;touch.startY=touch.lastY=e.clientY;touch.moveX=0;touch.jump=false;touch.use=false;touch.gestureLocked=false;setTimeout(()=>{if(touch.active&&touch.id===e.pointerId&&!touch.gestureLocked){touch.use=true}},135)},{passive:false});
canvas.addEventListener('pointermove',e=>{if(!touch.active||e.pointerId!==touch.id)return;e.preventDefault();touch.lastX=e.clientX;touch.lastY=e.clientY;const dx=e.clientX-touch.startX,dy=e.clientY-touch.startY;if(Math.abs(dy)>TOUCH_JUMP&&Math.abs(dy)>Math.abs(dx)*1.15){touch.gestureLocked=true;if(dy<0)touch.jump=true}else if(Math.abs(dx)>TOUCH_DEAD){touch.gestureLocked=true;touch.moveX=Math.max(-1,Math.min(1,dx/TOUCH_RUN))}},{passive:false});
canvas.addEventListener('pointerup',e=>{if(e.pointerId===touch.id){e.preventDefault();resetTouch()}},{passive:false});
canvas.addEventListener('pointercancel',e=>{if(e.pointerId===touch.id)resetTouch()});
setTimeout(()=>document.getElementById('veil').style.opacity=0,120);setTimeout(()=>document.getElementById('hint').style.opacity=.22,9000);
let AC=null,master=null,drone=null;
function audioStart(){if(AC)return;AC=new (AudioContext||webkitAudioContext)();master=AC.createGain();master.gain.value=.18;master.connect(AC.destination);const o1=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o1.type='sine';o2.type='triangle';o1.frequency.value=54;o2.frequency.value=81.2;g.gain.value=.045;f.type='lowpass';f.frequency.value=320;o1.connect(f);o2.connect(f);f.connect(g);g.connect(master);o1.start();o2.start();drone={o1,o2,g}}
function ping(freq=220,d=.12,vol=.08){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(freq,AC.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.55,AC.currentTime+d);g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+d)}
const world={w:2400,h:900,groundY:705};
const platforms=[{x:0,y:705,w:1120,h:195},{x:1210,y:705,w:1190,h:195},{x:330,y:432,w:330,h:18},{x:625,y:392,w:330,h:18},{x:925,y:350,w:500,h:18},{x:1400,y:318,w:420,h:18},{x:1790,y:285,w:610,h:18},{x:1065,y:615,w:145,h:20}];
const player={x:120,y:620,w:26,h:58,vx:0,vy:0,on:false,face:1,dead:false};
const crate={x:455,y:645,w:58,h:58,vx:0};const plate={x:780,y:695,w:92,h:10,pressed:false};const gate={x:940,y:505,w:28,h:200,open:0};const generator={x:1570,y:630,w:56,h:70,on:false,pulse:0};const elevator={x:285,y:635,w:130,h:18,targetY:635,powered:false};const exit={x:2220,y:206,w:66,h:79,open:false};
let complete=false,completeT=0,cam={x:0,y:0};
const rain=Array.from({length:120},()=>({x:Math.random()*world.w,y:Math.random()*world.h,l:14+Math.random()*36,s:160+Math.random()*250,a:.05+Math.random()*.12}));
const motes=Array.from({length:70},()=>({x:Math.random()*world.w,y:150+Math.random()*540,r:.5+Math.random()*2,s:.08+Math.random()*.2}));
function near(a,b,d=85){const ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2;return Math.hypot(ax-bx,ay-by)<d}
function solidRects(){return [...platforms,{x:gate.x,y:gate.y+gate.open,w:gate.w,h:gate.h-gate.open},{x:elevator.x,y:elevator.y,w:elevator.w,h:elevator.h}]}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function movePlayer(dt){const keyDir=(keys.KeyA||keys.ArrowLeft?-1:0)+(keys.KeyD||keys.ArrowRight?1:0);const dir=Math.max(-1,Math.min(1,keyDir+(touch.active?touch.moveX:0)));const accel=player.on?1350:620,max=250;player.vx+=dir*accel*dt;if(!dir)player.vx*=Math.pow(.0005,dt);player.vx=Math.max(-max,Math.min(max,player.vx));if(dir)player.face=dir;if((keys.Space||keys.ArrowUp||touch.jump)&&player.on){player.vy=-485;player.on=false;touch.jump=false;ping(120,.08,.03)}player.vy+=1200*dt;player.vy=Math.min(player.vy,780);let nx=player.x+player.vx*dt,test={...player,x:nx};if(rectHit(test,crate)){const push=player.vx*dt,ct={...crate,x:crate.x+push};let blocked=solidRects().some(r=>rectHit(ct,r));if(!blocked){crate.x+=push;crate.vx=player.vx*.75}else nx=player.x}for(const r of solidRects())if(rectHit({...player,x:nx},r)){if(player.vx>0)nx=r.x-player.w;else if(player.vx<0)nx=r.x+r.w;player.vx=0}player.x=nx;let ny=player.y+player.vy*dt;player.on=false;for(const r of solidRects()){const t={...player,y:ny};if(rectHit(t,r)){if(player.vy>0&&player.y+player.h<=r.y+12){ny=r.y-player.h;player.vy=0;player.on=true}else if(player.vy<0&&player.y>=r.y+r.h-12){ny=r.y+r.h;player.vy=0}}}player.y=ny;if(player.y>920)respawn()}
function updateCrate(dt){crate.vx*=Math.pow(.015,dt);let nx=crate.x+crate.vx*dt,t={...crate,x:nx};if(solidRects().some(r=>rectHit(t,r)))crate.vx=0;else crate.x=nx;crate.y=world.groundY-crate.h}
function respawn(){player.x=generator.on?1020:120;player.y=600;player.vx=player.vy=0;ping(70,.35,.08)}
let eLatch=false;
function interactions(dt){plate.pressed=rectHit({...crate,y:crate.y+4},plate)||rectHit({...player,y:player.y+4},plate);gate.open+=((plate.pressed?190:0)-gate.open)*Math.min(1,dt*5);elevator.powered=generator.on;if(generator.on)generator.pulse+=dt;const use=keys.KeyE||touch.use;if(use&&!eLatch){if(near(player,generator,105)&&!generator.on){generator.on=true;ping(330,.45,.12);setTimeout(()=>ping(495,.35,.08),120)}else if(generator.on&&near(player,elevator,110)){elevator.targetY=elevator.y>500?410:635;ping(180,.2,.06)}else if(near(player,exit,115)&&player.y<330){exit.open=true;ping(600,.5,.1)}}eLatch=use;if(touch.use)touch.use=false;if(elevator.powered){const old=elevator.y;elevator.y+=(elevator.targetY-elevator.y)*Math.min(1,dt*2.2);const dy=elevator.y-old;if(Math.abs(dy)>.01){const standing=player.x+player.w>elevator.x&&player.x<elevator.x+elevator.w&&Math.abs((player.y+player.h)-old)<8;if(standing)player.y+=dy}}if(exit.open&&player.x>2280&&player.y<330&&!complete){complete=true;completeT=0;ping(880,.8,.1)}}
function updateCam(dt){let tx=player.x-W*.43,ty=player.y-H*.58;tx=Math.max(0,Math.min(world.w-W,tx));ty=Math.max(0,Math.min(220,ty));cam.x+=(tx-cam.x)*Math.min(1,dt*3.2);cam.y+=(ty-cam.y)*Math.min(1,dt*2.4)}
function bg(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#172128');g.addColorStop(.45,'#233238');g.addColorStop(1,'#0b1114');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const mx=W*.72-cam.x*.05,my=130-cam.y*.05,rg=ctx.createRadialGradient(mx,my,5,mx,my,310);rg.addColorStop(0,'rgba(194,225,211,.20)');rg.addColorStop(1,'rgba(194,225,211,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-cam.x*.13,-cam.y*.08);ctx.strokeStyle='rgba(110,144,146,.08)';ctx.lineWidth=3;for(let x=-200;x<2800;x+=180){ctx.beginPath();ctx.moveTo(x,650);ctx.quadraticCurveTo(x+90,80,x+180,650);ctx.stroke()}ctx.restore();ctx.save();ctx.translate(-cam.x*.26,0);ctx.fillStyle='rgba(7,13,15,.55)';for(let x=-100;x<2600;x+=150){const h=180+(Math.sin(x*.017)+1)*70;ctx.fillRect(x,H-h,48,h)}ctx.restore()}
function drawWorld(t){ctx.save();ctx.translate(-cam.x,-cam.y);for(let i=0;i<5;i++){ctx.fillStyle=`rgba(170,200,195,${.016+i*.003})`;ctx.fillRect(cam.x-100,520+i*34,W+200,28)}ctx.fillStyle='#11191d';ctx.fillRect(0,0,world.w,150);ctx.fillStyle='rgba(118,157,155,.06)';for(let x=80;x<2350;x+=165)ctx.fillRect(x,32,110,76);ctx.strokeStyle='rgba(18,24,25,.9)';ctx.lineWidth=5;for(const x of [260,610,1290,1710,2060]){ctx.beginPath();ctx.moveTo(x,0);ctx.bezierCurveTo(x+18,120,x-15,220,x+5,330);ctx.stroke()}ctx.fillStyle='#141a1c';for(const p of platforms){ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='rgba(120,156,148,.07)';ctx.fillRect(p.x,p.y,p.w,3);ctx.fillStyle='#141a1c'}ctx.fillStyle='#05080a';ctx.fillRect(1120,705,90,195);let vg=ctx.createLinearGradient(1120,0,1210,0);vg.addColorStop(0,'rgba(104,160,150,.03)');vg.addColorStop(.5,'rgba(104,160,150,.12)');vg.addColorStop(1,'rgba(104,160,150,.03)');ctx.fillStyle=vg;ctx.fillRect(1120,555,90,350);ctx.strokeStyle=generator.on?'rgba(185,215,124,.34)':'rgba(100,130,125,.18)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(plate.x+46,705);ctx.lineTo(plate.x+46,735);ctx.lineTo(310,735);ctx.lineTo(310,680);ctx.stroke();ctx.fillStyle=plate.pressed?'#789269':'#3f4b47';ctx.fillRect(plate.x,plate.y+(plate.pressed?5:0),plate.w,7);ctx.fillStyle='#283032';ctx.fillRect(crate.x,crate.y,crate.w,crate.h);ctx.strokeStyle='rgba(190,210,198,.12)';ctx.strokeRect(crate.x+.5,crate.y+.5,crate.w-1,crate.h-1);ctx.beginPath();ctx.moveTo(crate.x+8,crate.y+8);ctx.lineTo(crate.x+crate.w-8,crate.y+crate.h-8);ctx.moveTo(crate.x+crate.w-8,crate.y+8);ctx.lineTo(crate.x+8,crate.y+crate.h-8);ctx.stroke();ctx.fillStyle='#20282a';ctx.fillRect(gate.x,gate.y+gate.open,gate.w,gate.h-gate.open);for(let y=gate.y+gate.open+10;y<gate.y+gate.h;y+=18){ctx.fillStyle='rgba(170,190,185,.08)';ctx.fillRect(gate.x+3,y,gate.w-6,3)}if(generator.on){const q=ctx.createRadialGradient(generator.x+28,generator.y+25,2,generator.x+28,generator.y+25,170);q.addColorStop(0,`rgba(190,215,112,${.17+.04*Math.sin(t*4)})`);q.addColorStop(1,'rgba(190,215,112,0)');ctx.fillStyle=q;ctx.fillRect(generator.x-150,generator.y-160,350,330)}ctx.fillStyle='#252d2d';ctx.fillRect(generator.x,generator.y,generator.w,generator.h);ctx.fillStyle=generator.on?'#c8dc7d':'#64706b';ctx.fillRect(generator.x+19,generator.y+18,18,8);ctx.strokeStyle='#0b0f10';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(generator.x+45,generator.y+35);ctx.lineTo(generator.x+62,generator.y+18);ctx.stroke();ctx.fillStyle='#394243';ctx.fillRect(elevator.x,elevator.y,elevator.w,elevator.h);ctx.strokeStyle=generator.on?'rgba(191,215,116,.5)':'rgba(120,140,136,.2)';ctx.lineWidth=2;ctx.strokeRect(elevator.x,elevator.y,elevator.w,elevator.h);ctx.strokeStyle='rgba(34,42,43,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(elevator.x+8,elevator.y);ctx.lineTo(elevator.x+8,120);ctx.moveTo(elevator.x+elevator.w-8,elevator.y);ctx.lineTo(elevator.x+elevator.w-8,120);ctx.stroke();ctx.fillStyle='#1d2527';ctx.fillRect(exit.x,exit.y,exit.w,exit.h);ctx.fillStyle=exit.open?'#0a0e0f':'#111719';ctx.fillRect(exit.x+9,exit.y+8,exit.w-18,exit.h-8);if(exit.open){ctx.fillStyle='rgba(181,216,189,.17)';ctx.fillRect(exit.x+13,exit.y+9,exit.w-26,exit.h-10)}for(const m of motes){ctx.fillStyle=`rgba(210,230,215,${.05+.03*Math.sin(t*m.s+m.x)})`;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill()}ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(player.x+player.w/2,player.y+player.h+4,24,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0a0c0d';ctx.fillRect(player.x+5,player.y+17,16,31);ctx.beginPath();ctx.arc(player.x+13,player.y+11,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#7f5d4c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(player.x+9,player.y+28);ctx.lineTo(player.x+8-player.face*5,player.y+44);ctx.stroke();ctx.strokeStyle='#0a0c0d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(player.x+10,player.y+47);ctx.lineTo(player.x+7-player.face*3,player.y+58);ctx.moveTo(player.x+17,player.y+47);ctx.lineTo(player.x+20+player.face*2,player.y+58);ctx.stroke();ctx.restore();ctx.save();ctx.strokeStyle='rgba(190,210,208,.10)';ctx.lineWidth=1;for(const r of rain){let xx=(r.x-cam.x*.75)%(W+300)-100,yy=(r.y+(t*r.s)%1000-cam.y*.4)%H;ctx.globalAlpha=r.a;ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx-5,yy+r.l);ctx.stroke()}ctx.restore();ctx.globalAlpha=1}
function ui(){const msg=!generator.on&&near(player,generator,130)?'HOLD  —  SWITCH ON':generator.on&&near(player,elevator,125)?'HOLD  —  LIFT':near(player,exit,120)&&player.y<340?'HOLD  —  OPEN':'';if(msg){ctx.font='600 11px system-ui';ctx.textAlign='center';ctx.fillStyle='rgba(220,232,226,.72)';ctx.fillText(msg,W/2,H-62)}if(!generator.on&&player.x>1100){ctx.fillStyle='rgba(197,215,207,.16)';ctx.font='500 11px system-ui';ctx.textAlign='center';ctx.fillText('the cable is dead',W/2,42)}if(generator.on&&player.x>1250&&player.y>500){ctx.fillStyle='rgba(200,220,160,.22)';ctx.font='500 11px system-ui';ctx.textAlign='center';ctx.fillText('something behind you moved',W/2,42)}if(complete){completeT+=1/60;ctx.fillStyle=`rgba(6,8,9,${Math.min(.92,completeT*.012)})`;ctx.fillRect(0,0,W,H);if(completeT>80){ctx.textAlign='center';ctx.fillStyle='rgba(225,234,230,.88)';ctx.font='650 14px system-ui';ctx.fillText('THE GLASSHOUSE',W/2,H/2-8);ctx.fillStyle='rgba(225,234,230,.48)';ctx.font='500 11px system-ui';ctx.fillText('chapter zero complete',W/2,H/2+18)}}}
let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(!complete){movePlayer(dt);updateCrate(dt);interactions(dt);updateCam(dt)}bg(now/1000);drawWorld(now/1000);ui();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
